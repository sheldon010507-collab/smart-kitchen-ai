<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Smart Kitchen AI - Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Core colors from CSS variables
            background: 'var(--background)',
            foreground: 'var(--foreground)',

            surface: 'var(--card)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',

            // TEXT COLORS - use foreground variants for text-* classes
            primary: 'var(--foreground)',           // text-primary = #37352f
            secondary: 'var(--foreground-secondary)', // text-secondary = #787774
            muted: 'var(--foreground-muted)',        // text-muted = #9b9a97

            // BACKGROUND COLORS - use background variants for bg-* classes
            'primary-bg': 'var(--primary)',
            'secondary-bg': 'var(--secondary)',      // bg-secondary-bg = #f7f6f3
            'muted-bg': 'var(--muted)',

            accent: 'var(--accent)',
            'accent-foreground': 'var(--accent-foreground)',
            accentHover: 'var(--primary)',

            destructive: 'var(--destructive)',
            success: 'var(--success)',
            warning: 'var(--warning)',

            border: 'var(--border)',
            input: 'var(--input-background)',
            ring: 'var(--ring)',

            // Food category colors
            'category-dairy': 'var(--category-dairy)',
            'category-dairy-fg': 'var(--category-dairy-fg)',
            'category-produce': 'var(--category-produce)',
            'category-produce-fg': 'var(--category-produce-fg)',
            'category-meat': 'var(--category-meat)',
            'category-meat-fg': 'var(--category-meat-fg)',
            'category-seafood': 'var(--category-seafood)',
            'category-seafood-fg': 'var(--category-seafood-fg)',
            'category-beverages': 'var(--category-beverages)',
            'category-beverages-fg': 'var(--category-beverages-fg)',
            'category-frozen': 'var(--category-frozen)',
            'category-frozen-fg': 'var(--category-frozen-fg)',

            // Status colors
            'status-critical': 'var(--status-critical-bg)',
            'status-low': 'var(--status-low-bg)',
            'status-ok': 'var(--status-ok-bg)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: {
            DEFAULT: 'var(--radius)',
          }
        }
      }
    }
  </script>
  <style>
    /* Minimal Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--foreground-muted);
    }

    input,
    select,
    textarea {
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 1px var(--primary) !important;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.15",
    "nodemailer": "https://aistudiocdn.com/nodemailer@^7.0.11"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
