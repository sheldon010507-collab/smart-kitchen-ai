<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Kitchen AI - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#F5F5F5', // Cool light gray
              surface: '#FFFFFF',
              primary: '#111827', // Gray 900
              secondary: '#6B7280', // Gray 500
              border: '#E5E7EB', // Gray 200
              accent: '#475569', // Slate 600 - Cold Accent
              accentHover: '#334155', // Slate 700
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F5F5F5;
        color: #111827;
        -webkit-font-smoothing: antialiased;
      }
      /* Minimal Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8; 
      }
      
      input, select, textarea {
        transition: all 0.2s ease;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #475569 !important;
        box-shadow: 0 0 0 1px #475569 !important;
      }
    </style>
  <script type="importmap">
{

    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "@vercel/node": "https://aistudiocdn.com/@vercel/node@^5.5.15",
    "nodemailer": "https://aistudiocdn.com/nodemailer@^7.0.11"
  }
}
</script>
